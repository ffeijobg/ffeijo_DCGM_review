apiVersion: v1
kind: Pod
metadata:
  name: gpu-inference-pod
  namespace: ai-workloads
  labels:
    app: inference
spec:
  runtimeClassName: nvidia
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  nodeSelector:
    nvidia.com/gpu.present: "true"
  initContainers:
    - name: model-loader
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Load models here'; ls /models"]
      volumeMounts:
        - name: model-repository
          mountPath: /models
  containers:
    - name: inference
      image: nvcr.io/nvidia/tritonserver:24.01-py3
      command: ["tritonserver"]
      args:
        - "--model-repository=/models"
        - "--model-control-mode=poll"
        - "--repository-poll-secs=30"
        - "--http-port=8000"
        - "--grpc-port=8001"
        - "--metrics-port=8002"
        - "--log-verbose=1"
      ports:
        - containerPort: 8000
          name: http
        - containerPort: 8001
          name: grpc
        - containerPort: 8002
          name: metrics
      # Required for actual cgroup access to /dev/nvidia* given this node's
      # no-cgroups = true nvidia-container-runtime config — see the matching
      # comment in device-plugin-ds.yaml and dcgm-exporter-ds.yaml. Without
      # this, NVML fails to init ("Unknown Error") even though the device
      # files and driver libraries are visibly injected into the container.
      securityContext:
        privileged: true
      resources:
        limits:
          nvidia.com/gpu: 1
          memory: "4Gi"
        requests:
          nvidia.com/gpu: 1
          memory: "2Gi"
      env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "all"
      readinessProbe:
        httpGet:
          path: /v2/health/ready
          port: 8000
        initialDelaySeconds: 15
        periodSeconds: 10
        failureThreshold: 6
      livenessProbe:
        httpGet:
          path: /v2/health/live
          port: 8000
        initialDelaySeconds: 30
        periodSeconds: 15
      volumeMounts:
        - name: model-repository
          mountPath: /models
  volumes:
    - name: model-repository
      emptyDir: {}