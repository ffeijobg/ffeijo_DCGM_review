apiVersion: v1
kind: Pod
metadata:
  name: gpu-inference-pod-legacy
  namespace: ai-workloads
  labels:
    app: inference
    pattern: legacy
spec:
  # Legacy/manual GPU-exposure pattern: no runtimeClassName, no device plugin,
  # no resources.limits nvidia.com/gpu request. The pod wires up the GPU itself
  # via privileged + hostPath mounts of the same device/lib/binary paths that
  # kind-config.yaml's extraMounts put on the node. Deployed alongside
  # pod-inference-modern.yaml so trainees can diff the two directly (Phase 7).
  tolerations:
    - key: "nvidia.com/gpu"
      operator: "Exists"
      effect: "NoSchedule"
  nodeSelector:
    nvidia.com/gpu.present: "true"
  initContainers:
    - name: model-loader
      image: busybox:1.36
      command: ["sh", "-c", "echo 'Load models here'; ls /models"]
      volumeMounts:
        - name: model-repository
          mountPath: /models
  containers:
    - name: inference
      image: nvcr.io/nvidia/tritonserver:24.01-py3
      command: ["tritonserver"]
      args:
        - "--model-repository=/models"
        - "--model-control-mode=poll"
        - "--repository-poll-secs=30"
        - "--http-port=8000"
        - "--grpc-port=8001"
        - "--metrics-port=8002"
        - "--log-verbose=1"
      securityContext:
        privileged: true
      ports:
        - containerPort: 8000
          name: http
        - containerPort: 8001
          name: grpc
        - containerPort: 8002
          name: metrics
      resources:
        limits:
          memory: "4Gi"
        requests:
          memory: "2Gi"
      env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: "all"
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: "compute,utility"
        - name: LD_LIBRARY_PATH
          value: "/opt/nvidia-libs"
      readinessProbe:
        httpGet:
          path: /v2/health/ready
          port: 8000
        initialDelaySeconds: 15
        periodSeconds: 10
        failureThreshold: 6
      livenessProbe:
        httpGet:
          path: /v2/health/live
          port: 8000
        initialDelaySeconds: 30
        periodSeconds: 15
      volumeMounts:
        - name: model-repository
          mountPath: /models
        - name: nvidia0
          mountPath: /dev/nvidia0
        - name: nvidiactl
          mountPath: /dev/nvidiactl
        - name: nvidia-uvm
          mountPath: /dev/nvidia-uvm
        - name: nvidia-uvm-tools
          mountPath: /dev/nvidia-uvm-tools
        - name: nvidia-libs
          mountPath: /opt/nvidia-libs
          readOnly: true
        - name: nvidia-smi-bin
          mountPath: /usr/bin/nvidia-smi
  volumes:
    - name: model-repository
      emptyDir: {}
    - name: nvidia0
      hostPath:
        path: /dev/nvidia0
    - name: nvidiactl
      hostPath:
        path: /dev/nvidiactl
    - name: nvidia-uvm
      hostPath:
        path: /dev/nvidia-uvm
    - name: nvidia-uvm-tools
      hostPath:
        path: /dev/nvidia-uvm-tools
    - name: nvidia-libs
      hostPath:
        path: /opt/nvidia-libs
    - name: nvidia-smi-bin
      hostPath:
        path: /usr/bin/nvidia-smi
